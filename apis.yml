name: GigaCrop
description: 'GigaCrop is an agricultural biotechnology company engineering the photosynthesis
  pathway to dramatically increase crop productivity. Founded by Chris Eiben, PhD, the company
  combines enzyme engineering and machine learning to optimize the RuBisCo enzyme, aiming to roughly
  double yields in staple crops such as corn and soy and to break past the limits that have held annual
  yield gains near one percent for a century. Backed by Playground Global, GigaCrop is working to make
  agriculture both more sustainable and more abundant.'
